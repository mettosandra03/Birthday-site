<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Blow Out the Candles</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Pacifico&family=Fredoka:wght@500;600;700&family=Caveat:wght@600;700&family=Playfair+Display:ital,wght@0,700;1,700&family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">

<link rel="stylesheet" href="style.css" />
<link rel="stylesheet" href="candles.css" />
</head>
<body class="candle-body">

  <canvas id="confettiCanvas"></canvas>

  <div class="candle-page">
    <h1 class="candle-heading" id="candleHeading">Make a wish<span class="to-name" id="candleName"></span>!</h1>
    <p class="candle-sub">Then blow into your microphone to blow out the candles 🎂</p>

    <div class="cake-wrap">
      <svg id="cakeSvg" viewBox="0 0 400 320" xmlns="http://www.w3.org/2000/svg">
        <!-- plate -->
        <ellipse cx="200" cy="300" rx="150" ry="14" fill="#E8DCE8"/>

        <!-- bottom tier -->
        <rect x="60" y="220" width="280" height="70" rx="10" fill="#FF8C69"/>
        <rect x="60" y="220" width="280" height="14" fill="#FFF3E9"/>

        <!-- top tier -->
        <rect x="110" y="150" width="180" height="70" rx="10" fill="#FF5D8F"/>
        <rect x="110" y="150" width="180" height="14" fill="#FFF3E9"/>

        <!-- candles + flames, generated by JS below -->
        <g id="candleGroup"></g>
      </svg>
    </div>

    <div class="breath-meter-wrap">
      <div class="breath-label">Blow power</div>
      <div class="breath-meter"><div class="breath-fill" id="breathFill"></div></div>
    </div>

    <button id="micBtn" class="primary-btn">🎤 Enable microphone</button>
    <p class="candle-or">— or, if your mic isn't working —</p>
    <button id="fallbackBtn" class="primary-btn secondary">💨 Click here to blow out the candles</button>

    <div class="after-message" id="afterMessage">
      <h2>🎉 Happy Birthday<span class="to-name" id="afterName">!</span></h2>
      <p id="afterText"></p>
      <a href="index.html" class="ghost-btn">Make another card</a>
    </div>
  </div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="firebase-config.js"></script>
<script src="candles.js"></script>
</body>
</html>
